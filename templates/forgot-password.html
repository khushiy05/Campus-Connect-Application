<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='img/logo-icon.png') }}" rel="icon" type="image/png">
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Poppins', sans-serif;
  background: #f5f6fa;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: #fff;
  width: 100%;
  max-width: 480px;
  padding: 40px;
  border-radius: 14px;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
}
h1 { font-size: 28px; color: #2b2b52; font-weight: 700; padding-bottom: 16px; border-bottom: 1px solid #e5e7eb; }
.sub { color: #6b7280; font-size: 14px; margin: 16px 0 6px; line-height: 1.6; }
label { display: block; margin: 16px 0 6px; font-weight: 500; color: #4b4b63; font-size: 15px; }
input[type="email"] {
  width: 100%;
  padding: 12px 14px;
  font: inherit;
  font-size: 15px;
  border: 1px solid #dcdce6;
  border-radius: 8px;
  outline: none;
}
input[type="email"]:focus { border-color: #6c63ff; box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.12); }
button {
  width: 100%;
  margin-top: 22px;
  padding: 13px;
  background: #fd7e14;
  color: #fff;
  font: inherit;
  font-size: 15px;
  font-weight: 600;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
button:hover { background: #e8710c; }
.msg { margin-top: 14px; font-size: 13px; display: none; }
.msg.error { color: #dc2626; display: block; }
.msg.success { color: #16a34a; display: block; }
.back { text-align: center; margin-top: 24px; font-size: 14px; color: #6c757d; }
.back a { color: #fd7e14; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Forgot Password</h1>
    <p class="sub">Enter your registered email and we'll help you reset your password.</p>

    <form id="forgotForm" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
      <p class="msg" id="msg"></p>
      <button type="submit">Forgot Password</button>
    </form>

    <p class="back">Remember your password? <a href="login.html">Back to Login</a></p>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const msg = document.getElementById('msg');
      msg.className = 'msg';

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        msg.textContent = 'Please enter a valid email address.';
        msg.classList.add('error');
        return;
      }
      // Logic goes here (will add next)
    });
  </script>
</body>
</html>
