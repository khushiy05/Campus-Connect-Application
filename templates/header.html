    <script>
        // Loads the "Our advertiser" marquee live from /api/advertisements/active,
        // which is populated via Admin > Advertisement. Replaces the previously
        // hardcoded GHRCE/YCCE/RCOEM logo list. Runs on every page since this
        // markup lives in header.html.
async function loadAdMarquee() {
    const track = document.getElementById('adMarqueeTrack');
    if (!track) return;
    try {
        const res = await fetch('/api/advertisements/active');
        const result = await res.json();
        const ads = (result.success && result.data) || [];

        if (!ads.length) {
            track.innerHTML = '';
            return;
        }

        // All active advertisers, one pass — no duplication needed since
        // the whole row slides fully across (right edge to left edge).
        track.innerHTML = ads
            .map(ad => {
                const src = `/static/uploads/advertisements/${encodeURIComponent(ad.LogoPath)}`;
                const alt = (ad.Name || '').replace(/"/g, '&quot;');
                return `<img src="${src}" alt="${alt}">`;
            })
            .join('');
    } catch (err) {
        console.error('Failed to load advertiser marquee:', err);
    }
}

document.addEventListener('DOMContentLoaded', loadAdMarquee);
    </script>
