<style>
  :root{
    --bg:#f5f6fa; --surface:#ffffff; --surface2:#fff4ec;
    --glass:#ffffff; --glass2:#fff4ec;
    --border:#e7e9f0;
    --primary:#ff6b00; --primary2:#ff8a3d;
    --teal:#0ea5a0; --purple:#7c3aed;
    --amber:#f59e0b; --green:#10b981; --red:#ef4444;
    --text:#1f2430; --muted:#6b7280;
    --shadow:0 4px 18px rgba(31,36,48,0.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  .orbs{display:none;}

  /* ── Header ── */
  header{
    position:relative;z-index:2;flex-shrink:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 28px;border-bottom:1px solid var(--border);
    background:var(--surface);box-shadow:var(--shadow);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-icon{
    width:42px;height:42px;border-radius:12px;
    background:linear-gradient(135deg,var(--teal),var(--purple) 55%,var(--primary));
    display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;
    box-shadow:0 4px 14px rgba(255,107,0,0.25);
  }
  .brand-name{font-family:'Outfit',sans-serif;font-size:19px;font-weight:800;
    background:linear-gradient(90deg,var(--teal),var(--purple) 55%,var(--primary));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand-sub{font-size:11px;color:var(--muted);}

  .location-badge{
    display:flex;align-items:center;gap:10px;
    padding:8px 15px;border-radius:30px;
    background:var(--surface2);border:1px solid #ffe0c2;
    font-size:12.5px;font-weight:600;min-width:150px;color:var(--text);
  }
  .location-badge.found{background:#e9fbf3;border-color:#bdf0d8;}
  .location-badge.denied{background:#fdecec;border-color:#f6c6c6;}
  .loc-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex-shrink:0;animation:pulse 1.4s ease-in-out infinite;}
  .location-badge.found .loc-dot{background:var(--green);animation:none;}
  .location-badge.denied .loc-dot{background:var(--red);animation:none;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .loc-text{display:flex;flex-direction:column;line-height:1.2;}
  .loc-city{font-size:12.5px;font-weight:700;color:var(--text);}
  .loc-caption{font-size:9.5px;color:var(--muted);font-weight:500;}

  /* ── Body split ── */
  .body-split{flex:1;display:flex;min-height:0;position:relative;z-index:1;}

  /* ── Chat column (left) ── */
  .chat-col{
    flex:0 0 62%;display:flex;flex-direction:column;min-width:0;
    border-right:1px solid var(--border);background:var(--bg);
  }
  .chat-messages{
    flex:1;overflow-y:auto;padding:22px 26px;
    display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth;
  }
  .chat-messages::-webkit-scrollbar{width:4px;}
  .chat-messages::-webkit-scrollbar-thumb{background:#d8dbe4;border-radius:4px;}

  .msg{display:flex;gap:10px;max-width:100%;animation:msgIn 0.35s ease both;}
  @keyframes msgIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .msg-avatar{
    width:32px;height:32px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:15px;margin-top:2px;
    background:linear-gradient(135deg,var(--teal),var(--purple) 55%,var(--primary));
    box-shadow:0 2px 8px rgba(124,58,237,0.25);
  }
  .msg-body{max-width:78%;}
  .msg-name{font-size:10.5px;color:var(--muted);margin-bottom:3px;font-weight:600;}
  .msg-bubble{
    background:var(--surface);border:1px solid var(--border);border-radius:4px 14px 14px 14px;
    padding:11px 15px;font-size:13.5px;line-height:1.55;box-shadow:var(--shadow);color:var(--text);
  }
  .msg.user{justify-content:flex-end;}
  .msg.user .msg-body{max-width:78%;}
  .msg.user .msg-bubble{
    border-radius:14px 4px 14px 14px;color:#fff;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    border-color:transparent;box-shadow:0 4px 14px rgba(255,107,0,0.25);
  }
  .msg.user .msg-name{text-align:right;}

  .typing-dots{display:flex;gap:4px;align-items:center;height:14px;}
  .typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--primary);animation:typingBounce 1.2s ease-in-out infinite;}
  .typing-dots span:nth-child(2){animation-delay:0.15s;}
  .typing-dots span:nth-child(3){animation-delay:0.3s;}
  @keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:0.5;}30%{transform:translateY(-5px);opacity:1;}}

  .suggested-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .suggest-chip{
    padding:6px 13px;border-radius:20px;font-size:11.5px;font-weight:600;cursor:pointer;
    background:var(--surface2);border:1px solid #ffe0c2;color:#c2540a;
    transition:all 0.2s;
  }
  .suggest-chip:hover{background:#ffe6d1;}

  .chat-input-area{
    flex-shrink:0;padding:14px 20px 18px;
    border-top:1px solid var(--border);background:var(--surface);
  }
  .chat-input-row{display:flex;gap:10px;align-items:center;}
  .chat-input-row input{
    flex:1;padding:12px 16px;border-radius:12px;
    background:var(--bg);border:1px solid var(--border);color:var(--text);
    font-size:13.5px;font-family:'Inter',sans-serif;outline:none;
  }
  .chat-input-row input::placeholder{color:#9aa1af;}
  .chat-input-row input:focus{border-color:var(--primary);}
  .send-btn{
    width:42px;height:42px;border-radius:12px;border:none;cursor:pointer;flex-shrink:0;
    background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:16px;
    display:flex;align-items:center;justify-content:center;transition:transform 0.15s;
    box-shadow:0 4px 14px rgba(255,107,0,0.3);
  }
  .send-btn:hover{transform:translateY(-1px);}
  .input-hint{font-size:10.5px;color:var(--muted);text-align:center;margin-top:8px;}

  /* ── Colleges column (right) ── */
  .colleges-col{
    flex:0 0 38%;display:flex;flex-direction:column;min-width:0;overflow:hidden;
    background:var(--surface);
  }
  .colleges-head{
    flex-shrink:0;padding:18px 20px 12px;border-bottom:1px solid var(--border);
  }
  .colleges-head h2{font-family:'Outfit',sans-serif;font-size:15.5px;font-weight:800;margin-bottom:3px;color:var(--text);}
  .colleges-head p{font-size:11.5px;color:var(--muted);}
  .colleges-body{flex:1;overflow-y:auto;padding:16px 18px;background:var(--bg);}
  .colleges-body::-webkit-scrollbar{width:4px;}
  .colleges-body::-webkit-scrollbar-thumb{background:#d8dbe4;border-radius:4px;}

  .state-panel{
    padding:22px 18px;text-align:center;background:var(--surface);border:1px solid var(--border);
    border-radius:14px;box-shadow:var(--shadow);
  }
  .state-panel .spinner{
    width:22px;height:22px;border-radius:50%;
    border:3px solid #ffe0c2;border-top-color:var(--primary);
    margin:0 auto 10px;animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .state-panel h3{font-size:13px;font-weight:700;margin-bottom:5px;color:var(--text);}
  .state-panel p{font-size:11px;color:var(--muted);line-height:1.5;}
  .manual-picker{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .manual-picker select{
    padding:9px 12px;border-radius:8px;background:var(--bg);
    border:1px solid var(--border);color:var(--text);font-size:12.5px;font-family:'Inter',sans-serif;
  }
  .manual-picker button{
    padding:9px 14px;border-radius:8px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-weight:700;font-size:12.5px;
  }
  .manual-picker button.secondary{background:var(--surface2);border:1px solid #ffe0c2;color:#c2540a;}

  .college-card{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:13px 15px;margin-bottom:10px;transition:border-color 0.2s, box-shadow 0.2s;box-shadow:var(--shadow);
  }
  .college-card:hover{border-color:#ffcda3;box-shadow:0 6px 20px rgba(255,107,0,0.12);}
  .college-rank{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:7px;font-size:10.5px;font-weight:800;
    background:var(--surface2);color:var(--primary);margin-bottom:7px;
  }
  .college-name{font-size:13px;font-weight:700;margin-bottom:4px;line-height:1.3;color:var(--text);}
  .college-meta{font-size:10.5px;color:var(--teal);font-weight:600;margin-bottom:5px;}
  .college-desc{font-size:11px;color:var(--muted);line-height:1.45;}
  .colleges-empty{text-align:center;padding:30px 10px;color:var(--muted);font-size:12px;}
  .colleges-empty .big{font-size:30px;margin-bottom:8px;}

  @media(max-width:900px){
    .body-split{flex-direction:column;overflow-y:auto;}
    .chat-col{flex:1 1 auto;border-right:none;border-bottom:1px solid var(--border);min-height:420px;}
    .colleges-col{flex:1 1 auto;}
  }
</style>
</head>
<body>

<div class="orbs"><div class="orb orb1"></div><div class="orb orb2"></div></div>

<!-- ── Header ── -->
<header>
  <div class="brand">
    <div class="brand-icon">🎓</div>

      <div class="brand-name">Campus Agent</div>

    </div>

  <div class="location-badge" id="locationBadge">
    <div class="loc-dot"></div>
    <div class="loc-text">
      <span class="loc-city" id="locCity">Detecting…</span>
      <span class="loc-caption" id="locCaption">Locating you</span>
    </div>
  </div>
</header>

<!-- ── Body: chat (left) | colleges (right) ── -->
<div class="body-split">

  <!-- Chat column -->
  <div class="chat-col">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Ask about registration, colleges, events, login..." autocomplete="off" />
        <button class="send-btn" id="sendBtn" title="Send">➤</button>
      </div>
      <div class="input-hint">Campus Agent only answers questions related to Campus Connect.</div>
    </div>
  </div>

  <!-- Colleges column -->
  <div class="colleges-col">
    <div class="colleges-head">
      <h2 id="collegesTitle">Top Colleges Near You</h2>
      <p id="collegesSub">Detecting your city…</p>
    </div>
    <div class="colleges-body" id="collegesBody">
      <div class="state-panel" id="statePanel">
        <div class="spinner"></div>
        <h3>Requesting your location…</h3>
        <p>Used only to find your city — nothing is stored or sent anywhere.</p>
      </div>
    </div>
  </div>

</div>

const CITY_ALIASES = {
  "bombay": "mumbai", "calcutta": "kolkata", "poona": "pune",
  "new delhi": "delhi", "bangaluru": "bangalore"
};

function normalizeCity(name){
  if(!name) return "";
  const n = name.trim().toLowerCase();
  return CITY_ALIASES[n] || n;
}

const badge = document.getElementById('locationBadge');
const locCity = document.getElementById('locCity');
const locCaption = document.getElementById('locCaption');
const statePanel0 = document.getElementById('statePanel');
const collegesBody = document.getElementById('collegesBody');
const collegesTitle = document.getElementById('collegesTitle');
const collegesSub = document.getElementById('collegesSub');

let detectedCityKey = null;
let detectedCityLabel = null;

function setBadge(status, cityLabel, caption){
  badge.className = 'location-badge' + (status ? ' ' + status : '');
  locCity.textContent = cityLabel;
  locCaption.textContent = caption;
}

function renderColleges(cityDisplay, key){
  detectedCityKey = key;
  detectedCityLabel = cityDisplay;
  const list = COLLEGES_BY_CITY[key];
  collegesTitle.textContent = `Top Colleges in ${cityDisplay}`;

  if (!list) {
    collegesSub.textContent = 'Not in our directory yet';
    collegesBody.innerHTML = `
      <div class="colleges-empty">
        <div class="big">🏫</div>
        We don't have ${escapeHtml(cityDisplay)} in our directory yet.<br>Ask me in chat and I can point you toward what we do cover.
      </div>`;
    return;
  }
  collegesSub.textContent = `${list.length} colleges found nearby`;
  collegesBody.innerHTML = list.map((c,i) => `
    <div class="college-card">
      <div class="college-rank">#${i+1}</div>
      <div class="college-name">${escapeHtml(c.name)}</div>
      <div class="college-meta">${escapeHtml(c.meta)}</div>
      <div class="college-desc">${escapeHtml(c.desc)}</div>
    </div>
  `).join('');
}

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showManualPicker(){
  const covered = Object.keys(COLLEGES_BY_CITY);
  const options = covered.map(c => `<option value="${c}">${c.charAt(0).toUpperCase()+c.slice(1)}</option>`).join('');
  collegesBody.innerHTML = `
    <div class="state-panel">
      <h3>Couldn't detect your location</h3>
      <p>Allow location access, or pick your city manually.</p>
      <div class="manual-picker">
        <select id="manualCitySelect">${options}</select>
        <button onclick="useManualCity()">Show Colleges</button>
        <button class="secondary" onclick="requestLocation()">Retry Location</button>
      </div>
    </div>
  `;
}

function useManualCity(){
  const sel = document.getElementById('manualCitySelect');
  const key = sel.value;
  const label = key.charAt(0).toUpperCase() + key.slice(1);
  setBadge('found', label, 'Selected manually');
  renderColleges(label, key);
}

function requestLocation(){
  setBadge('', 'Detecting…', 'Locating you');
  collegesSub.textContent = 'Detecting your city…';
  collegesBody.innerHTML = `
    <div class="state-panel">
      <div class="spinner"></div>
      <h3>Requesting your location…</h3>
      <p>Used only to find your city — nothing is stored or sent anywhere.</p>
    </div>
  `;

  if (!navigator.geolocation) {
    setBadge('denied', 'Unavailable', 'Geolocation not supported');
    showManualPicker();
    return;
  }
  navigator.geolocation.getCurrentPosition(onLocationSuccess, onLocationError, {
    enableHighAccuracy: false, timeout: 10000, maximumAge: 300000
  });
}

async function onLocationSuccess(position){
  const { latitude, longitude } = position.coords;
  try {
    const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`);
    if (!res.ok) throw new Error('Reverse geocode failed');
    const data = await res.json();
    const cityRaw = data.city || data.locality || data.principalSubdivision || 'Unknown';
    const key = normalizeCity(cityRaw);
    setBadge('found', cityRaw, 'Location detected');
    renderColleges(cityRaw, key);
  } catch (err) {
    setBadge('denied', 'Lookup failed', 'Could not resolve city');
    showManualPicker();
  }
}

function onLocationError(err){
  let caption = 'Location unavailable';
  if (err.code === err.PERMISSION_DENIED) caption = 'Permission denied';
  else if (err.code === err.TIMEOUT) caption = 'Request timed out';
  setBadge('denied', 'Not detected', caption);
  showManualPicker();
}

// Topics considered clearly off-topic → redirect politely instead of guessing
const OFFTOPIC_HINTS = ['weather','movie','recipe','joke','cricket','football','stock','politics','song','game','sports score'];

// Escapes regex special chars in a keyword before building a pattern from it
function escapeRegex(str){
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// Matches a keyword/phrase as a WHOLE word or phrase, not as a substring —
// e.g. 'hi' must not match inside 'this', 'which', 'shirt', etc.
function matchesKeyword(text, keyword){
  const pattern = new RegExp('(^|[^a-z0-9])' + escapeRegex(keyword) + '($|[^a-z0-9])', 'i');
  return pattern.test(text);
}

function findIntent(userText){
  const t = ' ' + userText.toLowerCase() + ' ';
  // Prefer longer/more specific keyword matches first (e.g. "didn't get my otp"
  // over a bare "otp"), so sort each intent's own keys isn't needed — instead
  // we scan intents in order but require a true whole-word/phrase match.
  for (const intent of INTENTS) {
    if (intent.keys.some(k => matchesKeyword(t, k))) return intent;
  }
  return null;
}

function isOfftopic(userText){
  const t = ' ' + userText.toLowerCase() + ' ';
  return OFFTOPIC_HINTS.some(h => matchesKeyword(t, h));
}

function addMessage(role, html, suggestions){
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  if (role === 'user') {
    div.innerHTML = `
      <div class="msg-body">
        <div class="msg-name">You</div>
        <div class="msg-bubble">${html}</div>
      </div>`;
  } else {
    const chips = (suggestions && suggestions.length)
      ? `<div class="suggested-row">${suggestions.map(s => `<span class="suggest-chip" onclick="askSuggested('${s.replace(/'/g,"\\'")}')">${escapeHtml(s)}</span>`).join('')}</div>`
      : '';
    div.innerHTML = `
      <div class="msg-avatar">🤖</div>
      <div class="msg-body">
        <div class="msg-name">Campus Agent</div>
        <div class="msg-bubble">${html}</div>
        ${chips}
      </div>`;
  }
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function showTyping(){
  const div = document.createElement('div');

}
function hideTyping(){
  const t = document.getElementById('typingIndicator');

}

function respondTo(userText){
  showTyping();
  setTimeout(() => {
    hideTyping();
    const intent = findIntent(userText);
    if (intent) {
      addMessage('bot', intent.reply(), intent.suggest);
      return;
    }
    if (isOfftopic(userText)) {
      addMessage('bot',
        `I can only help with questions related to <strong>Campus Connect</strong> — registration, colleges, login, events, and support. Try asking me one of those!`,
        ['What is Campus Connect?', 'How do I register?', 'Which colleges are covered?']
      );
      return;
    }
    addMessage('bot',
      `I'm not fully sure about that one — I'm focused on <strong>Campus Connect</strong> topics like registration, login, colleges, and events. Could you rephrase, or try one of these?`,
      ['What is Campus Connect?', 'How do I register?', 'Which colleges are covered?']
    );
  }, 650 + Math.random()*500);
}

function sendMessage(){
  const text = chatInput.value.trim();
  if (!text) return;
  addMessage('user', escapeHtml(text));
  chatInput.value = '';
  respondTo(text);
}

function askSuggested(text){
  addMessage('user', escapeHtml(text));
  respondTo(text);
}
