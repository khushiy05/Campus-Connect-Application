<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campus Agent — Campus Connect Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f5f6fa; --surface:#ffffff; --surface2:#fff4ec;
    --glass:#ffffff; --glass2:#fff4ec;
    --border:#e7e9f0;
    --primary:#ff6b00; --primary2:#ff8a3d;
    --teal:#0ea5a0; --purple:#7c3aed;
    --amber:#f59e0b; --green:#10b981; --red:#ef4444;
    --text:#1f2430; --muted:#6b7280;
    --shadow:0 4px 18px rgba(31,36,48,0.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }

  /* ── Header ── */
  header{
    position:relative;z-index:2;flex-shrink:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 28px;border-bottom:1px solid var(--border);
    background:var(--surface);box-shadow:var(--shadow);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-icon{
    width:42px;height:42px;border-radius:12px;
    background:linear-gradient(135deg,var(--teal),var(--purple) 55%,var(--primary));
    display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;
    box-shadow:0 4px 14px rgba(255,107,0,0.25);
  }
  .brand-name{font-family:'Outfit',sans-serif;font-size:19px;font-weight:800;
    background:linear-gradient(90deg,var(--teal),var(--purple) 55%,var(--primary));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand-sub{font-size:11px;color:var(--muted);}

  .status-badge{
    display:flex;align-items:center;gap:10px;
    padding:8px 15px;border-radius:30px;
    background:var(--surface2);border:1px solid #ffe0c2;
    font-size:12.5px;font-weight:600;min-width:150px;color:var(--text);
  }
  .status-badge.found{background:#e9fbf3;border-color:#bdf0d8;}
  .status-badge.denied{background:#fdecec;border-color:#f6c6c6;}
  .st-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex-shrink:0;animation:pulse 1.4s ease-in-out infinite;}
  .status-badge.found .st-dot{background:var(--green);animation:none;}
  .status-badge.denied .st-dot{background:var(--red);animation:none;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .st-text{display:flex;flex-direction:column;line-height:1.2;}
  .st-label{font-size:12.5px;font-weight:700;color:var(--text);}
  .st-caption{font-size:9.5px;color:var(--muted);font-weight:500;}

  /* ── Body split ── */
  .body-split{flex:1;display:flex;min-height:0;position:relative;z-index:1;}

  /* ── Chat column (left) ── */
  .chat-col{
    flex:0 0 62%;display:flex;flex-direction:column;min-width:0;
    border-right:1px solid var(--border);background:var(--bg);
  }
  .chat-messages{
    flex:1;overflow-y:auto;padding:22px 26px;
    display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth;
  }
  .chat-messages::-webkit-scrollbar{width:4px;}
  .chat-messages::-webkit-scrollbar-thumb{background:#d8dbe4;border-radius:4px;}

  .msg{display:flex;gap:10px;max-width:100%;animation:msgIn 0.35s ease both;}
  @keyframes msgIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .msg-avatar{
    width:32px;height:32px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:15px;margin-top:2px;
    background:linear-gradient(135deg,var(--teal),var(--purple) 55%,var(--primary));
    box-shadow:0 2px 8px rgba(124,58,237,0.25);
  }
  .msg-body{max-width:78%;}
  .msg-name{font-size:10.5px;color:var(--muted);margin-bottom:3px;font-weight:600;}
  .msg-bubble{
    background:var(--surface);border:1px solid var(--border);border-radius:4px 14px 14px 14px;
    padding:11px 15px;font-size:13.5px;line-height:1.55;box-shadow:var(--shadow);color:var(--text);
  }
  .msg-bubble a{color:var(--primary);font-weight:600;}
  .msg.user{justify-content:flex-end;}
  .msg.user .msg-body{max-width:78%;}
  .msg.user .msg-bubble{
    border-radius:14px 4px 14px 14px;color:#fff;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    border-color:transparent;box-shadow:0 4px 14px rgba(255,107,0,0.25);
  }
  .msg.user .msg-name{text-align:right;}

  .typing-dots{display:flex;gap:4px;align-items:center;height:14px;}
  .typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--primary);animation:typingBounce 1.2s ease-in-out infinite;}
  .typing-dots span:nth-child(2){animation-delay:0.15s;}
  .typing-dots span:nth-child(3){animation-delay:0.3s;}
  @keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:0.5;}30%{transform:translateY(-5px);opacity:1;}}

  .suggested-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .suggest-chip{
    padding:6px 13px;border-radius:20px;font-size:11.5px;font-weight:600;cursor:pointer;
    background:var(--surface2);border:1px solid #ffe0c2;color:#c2540a;
    transition:all 0.2s;
  }
  .suggest-chip:hover{background:#ffe6d1;}

  .chat-input-area{
    flex-shrink:0;padding:14px 20px 18px;
    border-top:1px solid var(--border);background:var(--surface);
  }
  .chat-input-row{display:flex;gap:10px;align-items:center;}
  .chat-input-row input{
    flex:1;padding:12px 16px;border-radius:12px;
    background:var(--bg);border:1px solid var(--border);color:var(--text);
    font-size:13.5px;font-family:'Inter',sans-serif;outline:none;
  }
  .chat-input-row input::placeholder{color:#9aa1af;}
  .chat-input-row input:focus{border-color:var(--primary);}
  .send-btn{
    width:42px;height:42px;border-radius:12px;border:none;cursor:pointer;flex-shrink:0;
    background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:16px;
    display:flex;align-items:center;justify-content:center;transition:transform 0.15s;
    box-shadow:0 4px 14px rgba(255,107,0,0.3);
  }
  .send-btn:hover{transform:translateY(-1px);}
  .input-hint{font-size:10.5px;color:var(--muted);text-align:center;margin-top:8px;}

  /* ── Colleges column (right) ── */
  .colleges-col{
    flex:0 0 38%;display:flex;flex-direction:column;min-width:0;overflow:hidden;
    background:var(--surface);
  }
  .colleges-head{
    flex-shrink:0;padding:18px 20px 12px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
  }
  .colleges-head h2{font-family:'Outfit',sans-serif;font-size:15.5px;font-weight:800;margin-bottom:3px;color:var(--text);}
  .colleges-head p{font-size:11.5px;color:var(--muted);}
  .refresh-btn{
    border:1px solid var(--border);background:var(--bg);border-radius:8px;
    width:30px;height:30px;cursor:pointer;font-size:13px;color:var(--muted);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .refresh-btn:hover{color:var(--primary);border-color:#ffcda3;}
  .colleges-body{flex:1;overflow-y:auto;padding:16px 18px;background:var(--bg);}
  .colleges-body::-webkit-scrollbar{width:4px;}
  .colleges-body::-webkit-scrollbar-thumb{background:#d8dbe4;border-radius:4px;}

  .state-panel{
    padding:22px 18px;text-align:center;background:var(--surface);border:1px solid var(--border);
    border-radius:14px;box-shadow:var(--shadow);
  }
  .state-panel .spinner{
    width:22px;height:22px;border-radius:50%;
    border:3px solid #ffe0c2;border-top-color:var(--primary);
    margin:0 auto 10px;animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .state-panel h3{font-size:13px;font-weight:700;margin-bottom:5px;color:var(--text);}
  .state-panel p{font-size:11px;color:var(--muted);line-height:1.5;}

  .college-card{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:13px 15px;margin-bottom:10px;transition:border-color 0.2s, box-shadow 0.2s;box-shadow:var(--shadow);
  }
  .college-card:hover{border-color:#ffcda3;box-shadow:0 6px 20px rgba(255,107,0,0.12);}
  .college-rank{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:7px;font-size:10.5px;font-weight:800;
    background:var(--surface2);color:var(--primary);margin-bottom:7px;
  }
  .college-name{font-size:13px;font-weight:700;margin-bottom:4px;line-height:1.3;color:var(--text);}
  .college-meta{font-size:10.5px;color:var(--teal);font-weight:600;margin-bottom:5px;}
  .college-desc{font-size:11px;color:var(--muted);line-height:1.45;}
  .colleges-empty{text-align:center;padding:30px 10px;color:var(--muted);font-size:12px;}

    .body-split{flex-direction:column;overflow-y:auto;}
    .chat-col{flex:1 1 auto;border-right:none;border-bottom:1px solid var(--border);min-height:420px;}
    .colleges-col{flex:1 1 auto;}

<!-- ── Header ── -->
<header>

    </div>
  </div>
</header>

<!-- ── Body: chat (left) | registered colleges (right) ── -->
<div class="body-split">

  <!-- Chat column -->
  <div class="chat-col">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Type 1-5 or ask about registration, colleges, events, login..." autocomplete="off" />
        <button class="send-btn" id="sendBtn" title="Send">➤</button>

      <div class="input-hint">Campus Agent only answers questions related to Campus Connect.</div>
    </div>
  </div>

  <!-- Registered colleges column -->
  <div class="colleges-col">
    <div class="colleges-head">
      <div>
        <h2 id="collegesTitle">Registered Colleges</h2>
        <p>Only colleges registered on Campus Connect</p>
      </div>
      <button class="refresh-btn" id="refreshBtn" title="Refresh">⟳</button>
    </div>
    <div class="colleges-body" id="collegesBody">
      <div class="state-panel" id="statePanel">
        <div class="spinner"></div>
        <h3>Loading registered colleges…</h3>
      </div>
    </div>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════
   SHARED HELPERS
   ═══════════════════════════════════════════════════════════ */
function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ═══════════════════════════════════════════════════════════
   PART 1 — REGISTERED COLLEGES ONLY (right panel)
   Fetches from your own backend. Point COLLEGES_API_URL at the
   real endpoint that returns colleges registered on Campus
   Connect (e.g. GET /api/colleges → [{name, meta, desc, link}]).
   Nothing is hardcoded — the panel only ever shows what the
   fetch actually returns. If the call fails, it shows an error
   state (not fake data) with a retry button.
   ═══════════════════════════════════════════════════════════ */

// TODO: replace with your real Campus Connect API endpoint
const COLLEGES_API_URL = '/api/colleges';

const statusBadge = document.getElementById('statusBadge');
const statusLabel = document.getElementById('statusLabel');
const statusCaption = document.getElementById('statusCaption');
const collegesBody = document.getElementById('collegesBody');
const collegesTitle = document.getElementById('collegesTitle');
const refreshBtn = document.getElementById('refreshBtn');

function setStatus(status, label, caption){
  statusBadge.className = 'status-badge' + (status ? ' ' + status : '');
  statusLabel.textContent = label;
  statusCaption.textContent = caption;
}

async function fetchRegisteredColleges(){
  setStatus('', 'Loading…', 'Fetching registered colleges');
  collegesBody.innerHTML = `
    <div class="state-panel">
      <div class="spinner"></div>
      <h3>Loading registered colleges…</h3>
    </div>`;

  try {
    const res = await fetch(COLLEGES_API_URL);
    if (!res.ok) throw new Error('Bad response');
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error('Bad format');
    setStatus(data.length ? 'found' : '', data.length ? 'Live' : 'Live', `${data.length} registered college${data.length !== 1 ? 's' : ''}`);
    renderRegisteredColleges(data);
  } catch (err) {
    setStatus('denied', 'Offline', 'Could not load colleges');
    collegesTitle.textContent = 'Registered Colleges';
    collegesBody.innerHTML = `
      <div class="colleges-empty">
        <div class="big">⚠️</div>
        Couldn't load registered colleges from the server.
        <div style="margin-top:10px;">
          <button class="refresh-btn" style="width:auto;padding:6px 14px;" onclick="fetchRegisteredColleges()">Retry</button>
        </div>
      </div>`;
  }
}

function renderRegisteredColleges(list){
  collegesTitle.textContent = `Registered Colleges (${list.length})`;
  if (!list.length) {
    collegesBody.innerHTML = `
      <div class="colleges-empty">
        <div class="big">🏫</div>
        No colleges are registered on Campus Connect yet.
      </div>`;
    return;
  }
  collegesBody.innerHTML = list.map((c, i) => `
    <div class="college-card">
      <div class="college-rank">#${i + 1}</div>
      <div class="college-name">${escapeHtml(c.name)}</div>
      <div class="college-meta">${escapeHtml(c.meta || 'Registered')}</div>
      <div class="college-desc">${escapeHtml(c.desc || '')}</div>
    </div>
  `).join('');
}

refreshBtn.addEventListener('click', fetchRegisteredColleges);

const OFFTOPIC_HINTS = ['weather', 'movie', 'recipe', 'joke', 'cricket', 'football', 'stock', 'politics', 'song', 'game', 'sports score'];

function escapeRegex(str){
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function matchesKeyword(text, keyword){
  const pattern = new RegExp('(^|[^a-z0-9])' + escapeRegex(keyword) + '($|[^a-z0-9])', 'i');
  return pattern.test(text);
}

function findMenuOption(userText){
  const t = userText.trim();
  if (/^[1-5]$/.test(t)) return MENU_OPTIONS[t];
  const low = ' ' + t.toLowerCase() + ' ';
  for (const key in MENU_OPTIONS) {
    if (MENU_OPTIONS[key].keys.some(k => matchesKeyword(low, k))) return MENU_OPTIONS[key];
  }
  return null;
}

function findIntent(userText){
  const t = ' ' + userText.toLowerCase() + ' ';
  for (const intent of INTENTS) {
    if (intent.keys.some(k => matchesKeyword(t, k))) return intent;
  }
  return null;
}

function isOfftopic(userText){
  const t = ' ' + userText.toLowerCase() + ' ';
  return OFFTOPIC_HINTS.some(h => matchesKeyword(t, h));
}

function addMessage(role, html, suggestions){
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  if (role === 'user') {
    div.innerHTML = `
      <div class="msg-body">
        <div class="msg-name">You</div>
        <div class="msg-bubble">${html}</div>
      </div>`;
  } else {
    const chips = (suggestions && suggestions.length)
      ? `<div class="suggested-row">${suggestions.map(s => `<span class="suggest-chip" onclick="askSuggested('${s.replace(/'/g, "\\'")}')">${escapeHtml(s)}</span>`).join('')}</div>`
      : '';
    div.innerHTML = `
      <div class="msg-avatar">🤖</div>
      <div class="msg-body">
        <div class="msg-name">Campus Agent</div>
        <div class="msg-bubble">${html}</div>
        ${chips}
      </div>`;
  }
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function showTyping(){
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typingIndicator';
  div.innerHTML = `
    <div class="msg-avatar">🤖</div>
    <div class="msg-body">
      <div class="msg-name">Campus Agent</div>
      <div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>
    </div>`;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}
function hideTyping(){
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

function menuListHtml(){
  return `Here's what you can explore:<br><br>
    <strong>1.</strong> Campus Connect Website<br>
    <strong>2.</strong> College Registration<br>
    <strong>3.</strong> Student Registration<br>
    <strong>4.</strong> RojgarSetu<br>
    <strong>5.</strong> Internship<br><br>
    Type a number (1-5), or ask me anything about Campus Connect.`;
}

function showMenuMessage(){
  addMessage('bot', menuListHtml(), ['1', '2', '3', '4', '5']);
}

function sendWelcome(){
  addMessage('bot', `👋 <strong>Welcome to Campus Connect!</strong><br>
    We bring Nagpur's engineering colleges, students and opportunities together on one platform. Register, discover events, and connect with jobs and internships — all in one place.`);
  setTimeout(showMenuMessage, 500);
}

function respondTo(userText){
  showTyping();
  setTimeout(() => {
    hideTyping();

    const menuOpt = findMenuOption(userText);
    if (menuOpt) {
      addMessage('bot', menuOpt.detail, ['Back to menu']);
      return;
    }
    if (/^(menu|back to menu|options|show menu)$/i.test(userText.trim())) {
      showMenuMessage();
      return;
    }

    const intent = findIntent(userText);
    if (intent) {
      addMessage('bot', intent.reply(), intent.suggest);
      return;
    }
    if (isOfftopic(userText)) {
      addMessage('bot',
        `I can only help with questions related to <strong>Campus Connect</strong>. Try one of the numbered options, or ask about registration, login, colleges, or events.`,
        ['1', '2', '3', '4', '5']
      );
      return;
    }
    addMessage('bot',
      `I'm not fully sure about that one — I'm focused on <strong>Campus Connect</strong> topics. Try a number (1-5), or rephrase your question.`,
      ['1', '2', '3', '4', '5']
    );
  }, 650 + Math.random() * 500);
}

function sendMessage(){
  const text = chatInput.value.trim();
  if (!text) return;
  addMessage('user', escapeHtml(text));
  chatInput.value = '';
  respondTo(text);
}

function askSuggested(text){
  addMessage('user', escapeHtml(text));
  respondTo(text);
}

sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

   INIT
   ═══════════════════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', () => {
  fetchRegisteredColleges();
  sendWelcome();
});
</script>
