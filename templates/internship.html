    function handleCityInput() {
        const input = document.getElementById('citySearch');
        const box = document.getElementById('citySuggestions');
        const value = input.value.trim().toLowerCase();

        if (!value) {
            box.style.display = 'none';
            box.innerHTML = '';
            filterInternships('');
            return;
        }

        const matches = ALL_INDIA_CITIES.filter(c => c.toLowerCase().includes(value)).slice(0, 20);

        if (matches.length === 0) {
            box.style.display = 'none';
            box.innerHTML = '';
        } else {
            box.innerHTML = matches.map(c =>
                `<div class="px-3 py-2" style="cursor:pointer;" onmousedown="pickCity('${c}')" onmouseover="this.style.background='#fff3ea'" onmouseout="this.style.background='#fff'">${c}</div>`
            ).join('');
            box.style.display = 'block';
        }

        filterInternships(value);
    }

    function pickCity(city) {
        document.getElementById('citySearch').value = city;
        document.getElementById('citySuggestions').style.display = 'none';
        filterInternships(city.toLowerCase());
    }

    function clearCityFilter() {
        document.getElementById('citySearch').value = '';
        document.getElementById('citySuggestions').style.display = 'none';
        filterInternships('');
    }

    function filterInternships(value) {
        const cards = document.querySelectorAll('.internship-card');
        let anyVisible = false;
        cards.forEach(card => {
            const city = card.getAttribute('data-city').toLowerCase();
            if (!value || city.includes(value)) {
                card.style.display = 'block';
                anyVisible = true;
            } else {
                card.style.display = 'none';
            }
        });
        document.getElementById('noResults').style.display = anyVisible ? 'none' : 'block';
    }

    // Hide suggestions when clicking elsewhere
    document.addEventListener('click', function (e) {
        if (!e.target.closest('#citySearch') && !e.target.closest('#citySuggestions')) {
            document.getElementById('citySuggestions').style.display = 'none';
        }
    });
    </script>
